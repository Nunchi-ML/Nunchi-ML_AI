[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "nunchi-ml"
version = "0.2.0"
description = "눈치 모델 공통 코드: 모델① 사고위험, 모델② 눈부심 전처리 · 추론, 모델③ 터널 순응 점수"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.1,<3", "pandas>=3,<4", "opencv-python-headless>=5,<6",
  "scikit-learn>=1.6,<2", "lightgbm>=4.5,<5", "joblib>=1.4,<2",
  "pvlib>=0.11",
]

[project.optional-dependencies]
test = ["pytest>=8"]

# src/nunchi_ml/ 아래 모델별 폴더(glare · tunnel · accident …)가 패키지 하나로 묶임 → import nunchi_ml.glare
[tool.setuptools.packages.find]
where = ["src"]
include = ["nunchi_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
